<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLDViewer Module Test</title>
    <link rel="stylesheet" href="./dist/sld.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #my-viewer-container {
            flex: 1;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: white;
            font-family: sans-serif;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div id="my-viewer-container"></div>

    <script src="./dist/sld-viewer.umd.js"></script>

                    "size": 100,

                    },
                    "slotRotation": {

                    },
                    "size": 100,
                    "statusRequired": true
                },
                {
                    "id": "node_6",
                    "symbolId": "dg",
                    "name": "DG Set",
                    "x": 100,
                    "y": 640,
                    "width": 100,

                    "status": "healthy",
                    "slots": {

                    },

                {

                    },

                {

                    "symbolId": "mcc_panel",

                    "x": 1100,

            "connections": [
                {
                    "id": "conn_1",
                    "from": "node_1",

                {

                {

                },
                {
                    "id": "conn_5",
                    "from": "node_6",

                },
                {
                    "id": "conn_6",
                    "from": "node_7",

                },
                {
                    "id": "conn_7",

                },
                {

                    "from": "node_5",

                },
                {
                    "id": "conn_9",
                    "from": "node_5",
                    "to": "node_10",
                    "type": "auto",
                    "arrowMode": "forward"
                }
            ],
            "hideSlotKeys": true,
            "version": "1.0"
        };

        const viewer = new SLDV('my-viewer-container', {
            config: config,
            hideSlotKeys: true,
            poll: {
                interval: 1000,
                fetch: async () => {
                    const rand = (min, max, d = 1) =>
                        (min + Math.random() * (max - min)).toFixed(d);

                    const valueByKey = {
                        voltage: () => `<b>${rand(220, 235)}</b> V`,
                        freq: () => `${rand(49.8, 50.2, 2)} Hz`,
                        current: () => `${rand(40, 180)} A`,
                        pow: () => `${rand(10, 95)} kW`,
                        kw: () => `${rand(50, 1200)} kW`,
                        kwh: () => `${rand(1200, 9800)} kWh`,
                        load: () => `${rand(25, 95)}%`,
                        temp: () => `${rand(32, 85)}°C`,
                        pf: () => rand(0.84, 0.99, 2),
                        kvar: () => `${rand(20, 250)} kVAr`,
                        soc: () => `${rand(45, 100)}%`,
                        backup: () => `${rand(8, 45)} min`,
                        source: () => (Math.random() > 0.85 ? 'DG' : 'GRID'),
                        mode: () => (Math.random() > 0.7 ? 'AUTO' : 'MANUAL')
                    };

                    const statusBySymbol = {
                        dg: () => (Math.random() > 0.9 ? "" : 'healthy'),
                        changeover_switch: () => (Math.random() > 0.85 ? 'stale' : 'healthy'),
                        vcb: () => (Math.random() > 0.94 ? 'alarm' : 'healthy'),
                        acb: () => (Math.random() > 0.94 ? 'alarm' : 'healthy'),
                        mccb: () => (Math.random() > 0.94 ? 'alarm' : 'healthy')
                    };

                    const updates = {};

                    config.nodes.forEach(node => {
                        const nodeUpdate = {};
                        const allSlots = Object.values(node.slots || {}).flat();

                        allSlots.forEach(key => {
                            if (valueByKey[key]) {
                                nodeUpdate[key] = valueByKey[key]();
                            } else {
                                nodeUpdate[key] = `--`;
                            }
                        });

                        nodeUpdate.status = statusBySymbol[node.symbolId]
                            ? statusBySymbol[node.symbolId]()
                            : (Math.random() > 0.95 ? 'alarm' : 'online');

                        updates[node.id] = nodeUpdate;
                    });

                    return updates;
                }
            }
        });
    </script>
</body>

</html>
